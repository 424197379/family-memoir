<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一本家庭回忆录，正在慢慢整理。">
  <title>家庭回忆录</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #f5f0e7; color: #40382d; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 28px; font-family: "Songti SC", "Noto Serif CJK SC", SimSun, serif; }
    main { width: min(100%, 520px); padding: 64px 24px; text-align: center; }
    .mark { width: 44px; height: 2px; margin: 0 auto 34px; background: #9b7656; }
    h1 { margin: 0 0 28px; font-size: clamp(30px, 8vw, 40px); font-weight: 500; letter-spacing: .12em; }
    p { margin: 12px 0; font-size: 18px; line-height: 1.9; }
    .note { margin-top: 36px; font-size: 15px; color: #756b5e; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>家庭回忆录</h1>
    <p>回忆录正在整理。</p>
    <p>把走过的岁月，慢慢留下来。</p>
    <p class="note">整理好后，会在这里与家人见面。</p>
  </main>
</body>
</html>
