<p><em>姥姥的女儿——王丽琴的回忆</em></p>
<p>冯玉英的家，往上追溯，要追到神木。她的祖父带着她的父亲，从神木来到后套。</p>
<p>1939年农历十一月二十三，冯玉英在后套出生。</p></body></html>
