<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="zh-CN" xml:lang="zh-CN"><head><title>三、养育孩子的那些年</title><link rel="stylesheet" href="book.css?v=loading2" /></head><body><h1>三、养育孩子的那些年</h1>
<p><em>姥姥的女儿——王丽琴的回忆</em></p>
<p>王丽琴小时候，饿了就去找母亲。</p>
<p>那时候还没包产到户，人们在队里干活，挣工分。家里五个孩子，四个儿子，一个女儿，王丽琴最小。母亲和一位她叫“婶子”的人一起喂猪，父亲在队里当队长。</p>
<p>父亲这个队长，一当就是很多年。从王丽琴开始记事，一直当到她结婚。</p>
<p>王丽琴记得那时的地洞炉子，记得烧玉米、烧糖菜。讲起这些吃食，她说：“那会儿每家每户的小孩都吃不了大饱。”</p>
<p>乡里有人来，母亲还要给来人做饭。这时候，王丽琴也留在那里，等着吃饭。</p>
<p>“我就在那儿不走，吃了饭再走。”</p></body></html>
