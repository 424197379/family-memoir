<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="zh-CN" xml:lang="zh-CN"><head><title>写在前面</title><link rel="stylesheet" href="book.css?v=loading2" /></head><body><h1>写在前面</h1>
<p>我是付博，姥姥的外孙。我想把她的往事写下来，留给家里人，也留给以后的孩子们。</p>
<p>说起姥姥，我最熟悉的是小时候去她家过暑假的日子。院子里的压水井，她烙的油烙饼，到现在还记得。可她年轻时过着怎样的生活，怎样把五个孩子养大，我知道得很少。妈妈和舅舅们记得的，又是我没有经历过的那些年。</p>
<p>有些事，现在还能听姥姥亲口讲；有些事，要听家里人慢慢回忆。我想趁着大家还记得，把它们留下来。日子久了，许多事会忘，写下来，以后就还有地方可以翻看。</p>
<p>这本书从姥姥的早年写起，一直写到今天，也放进家里的照片和声音。希望后来的孩子们读到这里，能多认识一点自己的长辈，知道他们是怎样过日子的。</p></body></html>
