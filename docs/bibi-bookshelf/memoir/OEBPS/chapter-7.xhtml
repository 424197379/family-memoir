<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="zh-CN" xml:lang="zh-CN"><head><title>四、子女长大，日子变化</title><link rel="stylesheet" href="book.css" /></head><body><h1>四、子女长大，日子变化</h1>
<h2 id="story-0">日子慢慢好了</h2>
<p><em>姥姥的女儿——王丽琴的回忆</em></p>
<p>小时候去找母亲，王丽琴惦记的是吃饭。讲到后来的日子，她记得家里有了肉，也有了酒。包产到户以后，四个哥哥都是壮劳力，家里的生活跟着有了起色。</p>
<p>她说：“一天比一天生活好了。”</p></body></html>
