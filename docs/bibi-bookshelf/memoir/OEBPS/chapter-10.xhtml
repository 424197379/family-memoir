<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="zh-CN" xml:lang="zh-CN"><head><title>七、今天</title><link rel="stylesheet" href="book.css?v=cache1" /></head><body><h1>七、今天</h1>
<p><em>姥姥的外孙——付博 · 2026年9月</em></p>
<p>如今我在深圳工作，妈妈王丽琴这几天陪着姥姥，问她从前家里吃什么，冬天腌多少酸白菜。问着问着，妈妈也说起了自己的小时候。</p>
<p>姥姥愿意聊的时候，就再听她讲一点。</p></body></html>
