<p><em>姥姥的外孙——付博 · 2026年9月</em></p>
<p>如今我在深圳工作，妈妈王丽琴这几天陪着姥姥。妈妈小时候去找母亲吃饭的往事，我想再听她讲讲。姥姥愿意聊的时候，也听她说说以前。</p></body></html>
