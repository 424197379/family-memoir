name: Publish memoir website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check video sizes
        run: python3 scripts/check_video_sizes.py web-media
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Reject originals and verify prepared media
        run: node scripts/check-publish-media.mjs --ref HEAD
      - name: Build flip-book
        run: npm run build:github
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: github-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
